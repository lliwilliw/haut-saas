services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haut_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [saas_postgres:/var/lib/postgresql/data]
    ports: ["5433:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/haut_saas
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGIN: http://localhost:3000
      CHATWOOT_URL: ${CHATWOOT_URL:-}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      MAUTIC_URL: ${MAUTIC_URL:-}
      MAUTIC_CLIENT_ID: ${MAUTIC_CLIENT_ID:-}
      MAUTIC_CLIENT_SECRET: ${MAUTIC_CLIENT_SECRET:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    depends_on: [postgres, redis]
    ports: ["3001:3001"]
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment:
      API_URL: http://api:3001
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  saas_postgres:
